; Geometry Wars 3 VR. Changes saved here apply while the game is running.

; 1 = play in VR through the active OpenXR runtime. 0 = the normal flat game, untouched.
vr=1

; The game simulates in fixed 1/60 s steps, which judders at any other refresh rate. 0 = step at
; the headset's refresh rate (asked from OpenXR), N = step at N Hz, -1 = the game's own 60 Hz.
sim_rate=0

; Eye resolution as a multiple of the headset's recommended size.
render_scale=1

; --- Levels ---
; Game units per metre. Larger makes the level a smaller, nearer object with more depth.
world_scale=100
; How many times closer you sit to the level than the flat game's camera (1 = the flat framing).
scene_zoom=1.6
; 1 = the backdrop holds still while the level turns as the ship moves. 0 = the backdrop
; swings round with the game's camera, as on a flat screen.
steady_background=1

; --- Menus ---
; Game units per metre for the menu world (the grid floor).
menu_scale=2.5

; --- HUD and menu panels ---
; Distance to the panel in metres, its size (1 = the angle the game drew it at), height in metres.
hud_distance=1.1
hud_size=1
hud_offset_y=0.1

; Score numbers that rise from kills, both at hud_distance: hud = where the game put them on its
; own screen (they sit a little towards the middle); level = experimental, aimed at the kill.
score_depth=hud

; Recentre: Home key, or click both sticks together.

; Image. anisotropy: texture filtering for surfaces seen at an angle (0 = the game's own, 16 = sharpest).
; bloom: strength of the game's glow (1 = as designed, 0 = none). Both apply as soon as you save.
anisotropy=16
bloom=1
; grid_upscale: the floor grid's line texture redrawn N times larger with mipmaps (0 = the game's own).
grid_upscale=8
